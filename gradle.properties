# Project-wide Gradle settings.
# Optimized for GitHub Actions ubuntu-latest (2 vCPU, 7GB RAM) with AGP 8.4.2 + Kotlin 1.9.24 + KSP
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
kotlin.code.style=official
